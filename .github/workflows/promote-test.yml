name: Promote Dev to Test frontend
on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      dev_run_id:
        description: Successful AWS Oregon frontend push run on dev (select the test ref)
        required: false
        default: latest
        type: string
      backend_dev_run_id:
        description: Backend Dev run already promoted to Test
        required: false
        default: latest
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: cortex-web-test
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:deployment
  promote:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: us-west-2
      CORTEX_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download and checksum-verify the accepted Dev website artifact
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEV_RUN_ID: ${{ inputs.dev_run_id || 'latest' }}
          BACKEND_DEV_RUN_ID: ${{ inputs.backend_dev_run_id || 'latest' }}
        run: node scripts/deploy/resolve-web-release.mjs "$DEV_RUN_ID" "$BACKEND_DEV_RUN_ID"
      - run: node scripts/deploy/policy.mjs test
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::223323955607:role/cortex-test-github-cortex-ui-mvp
          aws-region: us-west-2
          allowed-account-ids: '223323955607'
      - name: Verify the selected backend has already been promoted
        env:
          EXPECTED_API_TAG: ${{ steps.release.outputs.backend_api_tag }}
        run: |
          READY=false
          for ATTEMPT in $(seq 1 180); do
            ACTUAL=$(aws cloudformation describe-stacks --stack-name cortex-test-application --query 'Stacks[0].Outputs[?OutputKey==`ApiImageTag`].OutputValue | [0]' --output text 2>/dev/null || true)
            URL=$(aws cloudformation describe-stacks --stack-name cortex-test-delivery --query 'Stacks[0].Outputs[?OutputKey==`Url`].OutputValue | [0]' --output text 2>/dev/null || true)
            if test "$ACTUAL" = "$EXPECTED_API_TAG" && [[ "$URL" == https://* ]] && curl --fail --silent --max-time 15 "$URL/api/health"; then READY=true; break; fi
            sleep 10
          done
          test "$READY" = true || { echo 'The selected backend Dev release did not become ready in Test.'; exit 1; }
      - run: node scripts/deploy/publish.mjs test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-to-test-frontend-release
          path: .local/promotion/source.json
          include-hidden-files: true
          retention-days: 90
