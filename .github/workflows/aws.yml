name: AWS Oregon frontend
on:
  push:
    branches: [aws-migration]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, test, prod]
        default: dev
        description: Account to deploy (requires matching infrastructure and approvals)
permissions:
  contents: read
concurrency:
  group: cortex-web-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BACKEND_URL: ''
      NEXT_PUBLIC_DIRECT_UPLOAD: 'true'
      CORTEX_NEXT_DIST_DIR: .next-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -- --webpack
      - uses: actions/upload-artifact@v4
        with:
          name: static-web
          path: .next-ci
          include-hidden-files: true
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      CORTEX_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: static-web
          path: out
      - id: target
        run: |
          case "$CORTEX_ENVIRONMENT" in dev) ACCOUNT=909762691423;; test) ACCOUNT=223323955607;; prod) ACCOUNT=474711723859;; *) exit 1;; esac
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.target.outputs.account }}:role/cortex-${{ env.CORTEX_ENVIRONMENT }}-github-cortex-ui-mvp
          aws-region: us-west-2
          allowed-account-ids: ${{ steps.target.outputs.account }}
      - run: node scripts/deploy/publish.mjs "$CORTEX_ENVIRONMENT"
