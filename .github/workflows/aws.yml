name: AWS Oregon frontend
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_only:
        type: boolean
        default: true
        description: Build and verify only; do not authenticate to AWS or publish
      environment:
        type: choice
        options: [dev, prod]
        default: dev
        description: Account to deploy (Test uses its test-branch workflow; Prod remains locked)
permissions:
  contents: read
concurrency:
  group: cortex-web-${{ github.event_name }}-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BACKEND_URL: ''
      NEXT_PUBLIC_DIRECT_UPLOAD: 'true'
      CORTEX_NEXT_DIST_DIR: .next-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:deployment
      - run: npm run prepare:environments
      - run: npm run build -- --webpack
      - uses: actions/upload-artifact@v4
        with:
          name: static-web
          path: .next-ci
          include-hidden-files: true
  deploy:
    concurrency:
      group: cortex-web-deployment-${{ github.event.inputs.environment || 'dev' }}
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.prepare_only == false)
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      CORTEX_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: static-web
          path: out
      - id: target
        run: |
          node scripts/deploy/policy.mjs "$CORTEX_ENVIRONMENT"
          case "$CORTEX_ENVIRONMENT" in dev) ACCOUNT=909762691423;; test) ACCOUNT=223323955607;; prod) ACCOUNT=474711723859;; *) exit 1;; esac
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.target.outputs.account }}:role/cortex-${{ env.CORTEX_ENVIRONMENT }}-github-cortex-ui-mvp
          aws-region: us-west-2
          allowed-account-ids: ${{ steps.target.outputs.account }}
      - run: node scripts/deploy/publish.mjs "$CORTEX_ENVIRONMENT"
